version: '3.8'

services:
  # 🌐 1. NGINX (Reverse Proxy & HTTPS - Khelinaah ila bghiti tkhdem b domaine mn b3d)
  nginx:
    image: nginx:latest
    container_name: pilot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pilot-network

  # ☕ 2. Le Backend (Spring Boot)
  backend:
    build:
      context: ./pilot
      dockerfile: Dockerfile
    container_name: pilot_backend
    restart: unless-stopped
    # ⚠️ THE FIX: Khassna n-exposiw l'port 6225 bach l'Frontend (Navigateur) y9der y-connecta lih
    ports:
      - "6225:6225"
    environment:
      - SERVER_PORT=6225
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.10.10.50:5432/pilotdb
      - SPRING_DATASOURCE_USERNAME=kyntus_user
      - SPRING_DATASOURCE_PASSWORD=kyntus_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - pilot-network

  # 💻 3. Le Frontend (Next.js)
  frontend:
    build:
      context: ./pilot-frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ THE FIX: Daba l'build ghadi yakhod l'IP dyal serveur
        - NEXT_PUBLIC_API_URL=http://10.10.10.25:6225
        - NEXT_PUBLIC_WS_URL=ws://10.10.10.25:6225/ws
    container_name: pilot_frontend
    restart: unless-stopped
    # ⚠️ THE FIX: N-exposiw l'port 3114 bach t-accéder lih b http://10.10.10.25:3114
    ports:
      - "3114:3114"
    depends_on:
      - backend
    networks:
      - pilot-network

networks:
  pilot-network:
    driver: bridge