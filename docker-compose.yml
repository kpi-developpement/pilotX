version: '3.8'

services:
  backend:
    build:
      context: ./pilot
      dockerfile: Dockerfile
    container_name: pilot_backend
    restart: unless-stopped
    ports:
      - "6225:6225"
    environment:
      - SERVER_PORT=6225
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.10.10.50:5432/pilotdb
      - SPRING_DATASOURCE_USERNAME=kyntus_user
      - SPRING_DATASOURCE_PASSWORD=kyntus_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - pilot-network

  frontend:
    build:
      context: ./pilot-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://10.10.10.25:6225
        - NEXT_PUBLIC_WS_URL=http://10.10.10.25:6225/ws
    container_name: pilot_frontend
    restart: unless-stopped
    ports:
      - "2227:3000"
    depends_on:
      - backend
    networks:
      - pilot-network

networks:
  pilot-network:
    driver: bridge