version: '3.8'

services:
  # 🌐 1. NGINX (Reverse Proxy & HTTPS)
  nginx:
    image: nginx:latest
    container_name: pilot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pilot-network

  # ☕ 2. Le Backend (Spring Boot)
  backend:
    build:
      context: ./pilot
      dockerfile: Dockerfile
    container_name: pilot_backend
    restart: unless-stopped
    environment:
      - SERVER_PORT=6225
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.10.10.50:5432/pilotdb
      - SPRING_DATASOURCE_USERNAME=kyntus_user
      - SPRING_DATASOURCE_PASSWORD=kyntus_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - pilot-network

  # 💻 3. Le Frontend (Next.js)
  frontend:
    build:
      context: ./pilot-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://pilot.kyntus.fr
        - NEXT_PUBLIC_WS_URL=wss://pilot.kyntus.fr/ws
    container_name: pilot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - pilot-network

networks:
  pilot-network:
    driver: bridge