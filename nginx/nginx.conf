events {
    worker_connections 1024;
}

http {
    # Redirection automatique mn HTTP l HTTPS
    server {
        listen 80;
        server_name pilot.kyntus.fr;
        return 301 https://$host$request_uri;
    }

    # Serveur HTTPS
    server {
        listen 443 ssl;
        server_name pilot.kyntus.fr;

        # Les certificats li 3tawk l'IT
        ssl_certificate /etc/nginx/certs/kyntus.crt;
        ssl_certificate_key /etc/nginx/certs/kyntus.key;

        # Paramètres de sécurité SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 1. Route l'Frontend (Next.js) - ⚠️ THE FIX: Port 3114
        location / {
            proxy_pass http://frontend:3114;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 2. Route l'Backend API (Spring Boot)
        location /api/ {
            proxy_pass http://backend:6225/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. Route l'WebSockets (Spring Boot STOMP)
        location /ws/ {
            proxy_pass http://backend:6225/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}